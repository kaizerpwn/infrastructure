apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbo-deployment-production
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: carbo-production
  template:
    metadata:
      labels:
        app: carbo-production
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: carbo-container-production
          image: ghcr.io/kaizerpwn/carbo-hackathon:db2510604e5cd19f9f79b8d131bbdef2b89544c8
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "mysql://carbo:Yeo0uMIPP8Fcybe@mariadb-service-carbo-production:3306/carbo"
            - name: PRISMA_CLIENT_ENGINE_TYPE
              value: "binary"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openai-api-secret
                  key: JWT_SECRET
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-api-secret
                  key: OPENAI_API_KEY
      imagePullSecrets:
        - name: regcred
