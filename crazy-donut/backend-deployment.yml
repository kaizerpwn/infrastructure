apiVersion: apps/v1
kind: Deployment
metadata:
  name: crazy-donut-backend-deployment-production
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: crazy-donut-backend-production
  template:
    metadata:
      labels:
        app: crazy-donut-backend-production
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: crazy-donut-backend-container-production
          image: ghcr.io/kaizerpwn/crazy-donut-backend:1baffd0c75961489d8e29b170d10abf431d4727d
          ports:
            - containerPort: 8000
      imagePullSecrets:
        - name: regcred
