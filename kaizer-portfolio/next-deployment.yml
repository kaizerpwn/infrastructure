apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaizer-portfolio-deployment-production
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: kaizer-portfolio-production
  template:
    metadata:
      labels:
        app: kaizer-portfolio-production
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: kaizer-portfolio-container-production
          image: ghcr.io/kaizerpwn/kaizer-portfolio-next:c4b7ecf9e01449c581c046ba4583d66c3fa28090
          ports:
            - containerPort: 3000
      imagePullSecrets:
        - name: regcred
